<!-- [appBookStatus] es una directiva de atributo que establece backgroundColor via @HostBinding -->
<div class="book-card" [appBookStatus]="book.inStock">
  <div class="book-info">
    <h3 class="book-title">{{ book.title }}</h3>

    <!-- [ngStyle]: establece estilos inline dinámicamente — requiere NgStyle o CommonModule -->
    <p class="book-author" [ngStyle]="{ color: book.inStock ? '#00bfc5' : '#999' }">
      {{ book.author }}
    </p>

    <!-- [ngClass]: agrega/quita clases CSS dinámicamente -->
    <!-- <p class="book-author" [ngClass]="{ 'author-unavailable': !book.inStock }">{{ book.author }}</p> -->

    <div class="book-categories">
      <span class="category-tag" *ngFor="let category of book.categories">{{ category }}</span>
    </div>

    <!-- *ngIf con else usando ng-template (directiva estructural clásica) -->
    <div class="book-status">
      <ng-container *ngIf="book.inStock; else outOfStock">
        <span class="in-stock">In Stock</span>
        <button (click)="onAdd()">Add to Cart</button>
      </ng-container>
      <ng-template #outOfStock>
        <span class="out-of-stock">Out of Stock</span>
      </ng-template>
    </div>

    <!-- Equivalente con control flow moderno (@if / @for) — requiere Angular 17+ -->
    <!--
    @if (book.inStock) {
      <span class="in-stock">In Stock</span>
      <button (click)="onAdd()">Add to Cart</button>
    } @else {
      <span class="out-of-stock">Out of Stock</span>
    }
    -->
  </div>
</div>
