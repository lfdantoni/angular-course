<h2>Book Catalog</h2>

@if (activeCategory) {
  <p class="filter-notice">
    Filtered by: <strong>{{ activeCategory }}</strong>
    <!-- routerLink as string — clear filter -->
    <a routerLink="/books">Clear</a>
  </p>
}

<div class="cart-bar">
  <p>Cart items: {{ cart.length }}</p>
  @if (cart.length > 0) {
    <button class="clear-cart-btn" (click)="clearCart()">Clear Cart</button>
  }
</div>

<!-- Modern control flow (Angular 17+) - preferred -->
<div class="book-grid">
  @for (book of books; track book.id) {
    <!--
      viewDetail output: emitted when the card area is clicked (navigates to /books/:id)
      addToCart output: emitted when "Add to Cart" button is clicked (stopPropagation
        prevents this from also triggering viewDetail)
    -->
    <app-book
      [book]="book"
      (addToCart)="addToCart($event)"
      (viewDetail)="navigateToDetail($event)" />
  } @empty {
    <p>No books available.</p>
  }
</div>
