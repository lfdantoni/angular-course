<h2>Book Catalog</h2>

<!-- Category filter: each tag navigates with [queryParams]; "All" clears the filter -->
<div class="category-filter">
  <a class="filter-tag"
     [class.active]="!activeCategory"
     routerLink="/books">
    All
  </a>
  @for (category of categories; track category) {
    <a class="filter-tag"
       [class.active]="activeCategory === category"
       routerLink="/books"
       [queryParams]="{ category: category }">
      {{ category }}
    </a>
  }
</div>

<div class="cart-bar">
  <p>Cart items: {{ cart.length }}</p>
  @if (cart.length > 0) {
    <button class="clear-cart-btn" (click)="clearCart()">Clear Cart</button>
  }
</div>

<!-- Modern control flow (Angular 17+) - preferred -->
<div class="book-grid">
  @for (book of books; track book.id) {
    <!--
      viewDetail output: emitted when the card area is clicked (navigates to /books/:id)
      addToCart output: emitted when "Add to Cart" button is clicked (stopPropagation
        prevents this from also triggering viewDetail)
    -->
    <app-book
      [book]="book"
      (addToCart)="addToCart($event)"
      (viewDetail)="navigateToDetail($event)" />
  } @empty {
    <p>No books available.</p>
  }
</div>
