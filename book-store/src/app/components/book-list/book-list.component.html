<h2>Book Catalog</h2>

<p>Cart items: {{ cart.length }}</p>

<!-- Modern control flow (Angular 17+) - preferred -->
<div class="book-grid">
  @for (book of books; track book.id) {
    <app-book [book]="book" (addToCart)="addToCart($event)" />
  } @empty {
    <p>No books available.</p>
  }
</div>
