@if (book) {
  <div class="detail-card" [appBookStatus]="book.inStock">
    <div class="detail-header">
      <button class="back-btn" (click)="goBack()">← Back to Books</button>
    </div>

    <h2>{{ book.title }}</h2>

    <p class="author"
       [ngStyle]="{ color: book.inStock ? '#00bfc5' : '#999' }">
      {{ book.author }}
    </p>

    <div class="categories">
      @for (category of book.categories; track category) {
        <!--
          [queryParams] on routerLink — template binding (not programmatic).
          Generates URL: /books?category=<value>
          Equivalent to: this.router.navigate(['/books'], { queryParams: { category } })
        -->
        <a class="category-tag"
           routerLink="/books"
           [queryParams]="{ category: category }">
          {{ category }}
        </a>
      }
    </div>

    <p class="status">
      @if (book.inStock) {
        <span class="in-stock">In Stock</span>
      } @else {
        <span class="out-of-stock">Out of Stock</span>
      }
    </p>

    <p class="book-id">Book ID: {{ book.id }}</p>

    <!-- Uses location.back() to return to whichever list the user came from (/books or /books-obs) -->
    <!-- fragment example (lesson 2 reference): <a routerLink="/books" fragment="top"> navigates to /books#top -->
    <a class="fragment-link" (click)="goBack()">
      ↑ Back to book list
    </a>
  </div>
} @else {
  <div class="not-found">
    <p>Book not found.</p>
    <button (click)="goBack()">Back to Books</button>
  </div>
}
