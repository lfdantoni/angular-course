<nav class="navbar">
  <span class="brand">BookStore</span>

  <ul class="nav-links">
    <!-- routerLink as string — static route -->
    <li>
      <a routerLink="/books"
         routerLinkActive="active-link"
         [routerLinkActiveOptions]="{ exact: true }">
        Books
      </a>
    </li>
    <li>
      <a routerLink="/data-binding"
         routerLinkActive="active-link"
         [routerLinkActiveOptions]="{ exact: true }">
        Data Binding
      </a>
    </li>
    <li>
      <!-- Navigates to /add-book — authGuard redirects to /login if no token -->
      <a routerLink="/add-book"
         routerLinkActive="active-link"
         [routerLinkActiveOptions]="{ exact: true }">
        Add Book
      </a>
    </li>
    <li>
      <a routerLink="/add-book-tdf"
         routerLinkActive="active-link"
         [routerLinkActiveOptions]="{ exact: true }">
        Add Book (TDF)
      </a>
    </li>
    @if (isLoggedIn) {
      <li>
        <button class="logout-btn" (click)="logout()">Log out</button>
      </li>
    }
  </ul>
</nav>
