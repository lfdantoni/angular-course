@let currentBook = book();

<!-- [appBookStatus] is a custom attribute directive that sets backgroundColor via @HostBinding -->
<!-- (click) on the card navigates to detail; button click stops propagation to avoid this -->
<div class="book-card" [appBookStatus]="currentBook.inStock" (click)="onViewDetail()">
  <div class="book-info">
    <!--
      Custom pipe: {{ value | truncate:40 }} — limits the title to 40 chars + ellipsis.
      Defined in pipes/truncate.pipe.ts; added to this component's imports array.
    -->
    <h3 class="book-title">{{ currentBook.title | truncate:40 }}</h3>

    <!-- [ngStyle]: sets inline styles dynamically — requires NgStyle or CommonModule import -->
    <!--
      Built-in pipe: uppercase — transforms the author name to ALL CAPS.
      No import needed in standalone components when using UpperCasePipe from @angular/common.
    -->
    <p class="book-author" [ngStyle]="{ color: currentBook.inStock ? '#00bfc5' : '#999' }">
      {{ currentBook.author | uppercase }}
    </p>

    <!-- [ngClass]: adds/removes CSS classes dynamically — requires NgClass or CommonModule import -->
    <!-- <p class="book-author" [ngClass]="{ 'author-unavailable': !currentBook.inStock }">{{ currentBook.author }}</p> -->
    <div class="book-categories">
      @for (category of currentBook.categories; track category) {
        <span class="category-tag">{{ category }}</span>
      }
    </div>
    <!-- Modern control flow (Angular 17+) - preferred -->
    <div class="book-status">
      @if (currentBook.inStock) {
        <span class="in-stock">In Stock</span>
        <button (click)="onAdd($event)">Add to Cart</button>
      } @else {
        <span class="out-of-stock">Out of Stock</span>
      }
    </div>

    <!-- Legacy structural directive - same result, common in existing projects and exams -->
    <!-- Requires importing NgIf (or CommonModule) in the component's imports array -->
    <!--
    <div class="book-status">
      <span *ngIf="currentBook.inStock; else outOfStock" class="in-stock">In Stock</span>
      <button *ngIf="currentBook.inStock" (click)="onAdd($event)">Add to Cart</button>
      <ng-template #outOfStock>
        <span class="out-of-stock">Out of Stock</span>
      </ng-template>
    </div>
    -->
  </div>
</div>
